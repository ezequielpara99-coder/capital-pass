<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capital Pass</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0705;
    color: #f7f3ed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .mark {
    width: 64px;
    height: 64px;
    border-radius: 45% 55% 65% 35%;
    transform: rotate(-18deg);
    background: linear-gradient(135deg, #ff2a1a 0%, #ff3b24 45%, #ff6530 100%);
    box-shadow: 0 0 40px rgba(255,59,36,.4);
    margin-bottom: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: rgba(247,243,237,.5);
    max-width: 320px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  button {
    height: 44px;
    padding: 0 24px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #ff2a1a, #ff5a2a);
    color: white;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"></div>
    <h1>Sin conexión</h1>
    <p>No pudimos conectar con Capital Pass. Revisá tu internet e intentá de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
